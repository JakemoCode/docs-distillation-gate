name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The suite builds throwaway git repositories and measures them, so git
      # needs an identity even though nothing is pushed.
      - name: Configure git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git config --global init.defaultBranch main

      # No dependencies. The gate and its suite are node built-ins only.
      - name: Test
        run: npm test
